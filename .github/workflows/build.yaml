name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Update README
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: "Oktavian19"
        run: python today.py

      - name: Commit and push changes
        run: |
          git config --global user.email "oktavianeka4@gmail.com"
          git config --global user.name "Oktavian19"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update profile terminal stats [skip ci]"
          git push

